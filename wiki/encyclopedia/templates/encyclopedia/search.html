{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ query }}
{% endblock %}

{% block body %}
    {% if matched_entries %}
    <ul>
        {% for entry in matched_entries %}
            <li><a href="{% url 'entry' entry %}">{{ entry }}</a></li>
        {% endfor %}
    </ul>
    {% else  %}
        <h1>No entry found</h1>
    {% endif %}
{% endblock %}
