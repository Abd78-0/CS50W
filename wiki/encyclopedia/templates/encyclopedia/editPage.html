{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit {{ title }}
{% endblock %}

{% block body %}
    <h1>Edit Page: {{ title }}</h1>

    <form action="{% url 'editPage' title %}" method="post">
        {% csrf_token %}
        <textarea name="newContent" rows="10" cols="50">{{ current_content }}</textarea>
        <br>
        <input type="submit" value="Save Changes">
    </form>
{% endblock %}
